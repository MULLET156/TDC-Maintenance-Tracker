<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>TDC Maintenance Tracker</title>
<meta name="description" content="Toledo Dental Care maintenance checklists and completion log.">
<meta name="robots" content="noindex, nofollow">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one working column; status band on top, tabbed checklists below, each task an indicator-strip row */
:root{
  --bg:#F3F7F7; --surface:#FFFFFF; --sunk:#E8EFEF; --line:#D3DEDE;
  --ink:#122A2E; --muted:#5A7175; --accent:#0E6B73; --accent-ink:#FFFFFF; --accent-soft:#DCEFEF;
  --over:#C2362F; --over-soft:#FBE6E4; --soon:#B9770E; --soon-soft:#FBF0D9;
  --ok:#2E7D4F; --ok-soft:#E1F2E7; --new:#6B7F84; --new-soft:#E9EEEF;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1A1C; --surface:#152629; --sunk:#1B3034; --line:#2A4246;
  --ink:#E4EFEF; --muted:#93AAAE; --accent:#4FB7BF; --accent-ink:#06191B; --accent-soft:#173B3F;
  --over:#F07D74; --over-soft:#3A1D1B; --soon:#E8B04F; --soon-soft:#352A14;
  --ok:#6BC891; --ok-soft:#16301F; --new:#90A3A7; --new-soft:#1E2E31; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1A1C; --surface:#152629; --sunk:#1B3034; --line:#2A4246;
  --ink:#E4EFEF; --muted:#93AAAE; --accent:#4FB7BF; --accent-ink:#06191B; --accent-soft:#173B3F;
  --over:#F07D74; --over-soft:#3A1D1B; --soon:#E8B04F; --soon-soft:#352A14;
  --ok:#6BC891; --ok-soft:#16301F; --new:#90A3A7; --new-soft:#1E2E31; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 64px;display:flex;flex-direction:column;gap:18px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;position:relative}
.hdr-tools{align-self:flex-start;padding-top:8px;flex-direction:column;flex-wrap:nowrap;align-items:flex-end;align-content:flex-end}
.hdr-row2{display:flex;gap:8px;align-self:flex-end}
.hdr-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:8px}
.iconbtn{width:36px;height:36px;padding:0!important;justify-content:center}
.iconbtn svg{width:18px;height:18px}
.iconbtn span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sync{font-size:12.5px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.dot.err{background:var(--over);box-shadow:0 0 0 3px var(--over-soft)}
@media (prefers-reduced-motion:no-preference){.dot.busy{animation:pulse 1.2s ease-in-out infinite}@keyframes pulse{50%{opacity:.35}}}
@media (max-width:560px){.hdr-tools{align-self:auto;padding-top:0;width:100%;align-items:flex-start;align-content:flex-start}.hdr-row{justify-content:flex-start}.hdr-row2{align-self:flex-start}}
.brand small{display:block;font-family:var(--f-display);font-stretch:85%;font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:12px;color:var(--accent)}
.brand h1{margin:2px 0 0;font-family:var(--f-display);font-stretch:80%;font-weight:800;font-size:clamp(26px,5vw,34px);line-height:1.05;text-wrap:balance}
.logo{display:block;margin-bottom:8px}
.logo img{display:block;height:56px;width:auto;max-width:100%}
.logo .logo-d{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo .logo-l{display:none}:root:not([data-theme="light"]) .logo .logo-d{display:block}}
:root[data-theme="dark"] .logo .logo-l{display:none}
:root[data-theme="dark"] .logo .logo-d{display:block}
.title-row{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
@media (min-width:561px){
  header.top{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"logo tools1" "title tools2";column-gap:12px;row-gap:0;align-items:end}
  header.top .brand,header.top .hdr-tools{display:contents}
  header.top .logo{grid-area:logo}
  header.top .title-row{grid-area:title}
  header.top .hdr-row{grid-row:1;grid-column:1/-1;justify-self:end;align-self:start;padding-top:8px}
  header.top .hdr-row2{grid-area:tools2;align-self:center;justify-self:end}
}
.hdr-date{font-family:var(--f-mono);font-size:13px;color:var(--muted);white-space:nowrap;margin:0}
.whoami{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 6px 5px 14px}
.whoami label{font-size:13px;color:var(--muted)}
.hdr-tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.soundbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.soundbtn svg{width:16px;height:16px}
.soundbtn.setupbtn{color:var(--ink)}
.soundbtn.setupbtn:hover{border-color:var(--accent)}
.soundbtn.setupbtn[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.soundbtn[aria-pressed=true]{color:var(--accent);border-color:var(--accent)}
.whoami select{border:0;background:var(--accent-soft);color:var(--ink);border-radius:999px;padding:8px 12px;font-family:var(--f-mono);font-weight:500}

.band{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.tile{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);position:relative;overflow:hidden}
.tile::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--c)}
.tile b{font-family:var(--f-display);font-stretch:80%;font-weight:800;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.tile span{font-family:var(--f-display);font-stretch:85%;font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:11.5px;color:var(--muted)}
.tile[data-k=over]{--c:var(--over)} .tile[data-k=over] b{color:var(--over)}
.tile[data-k=soon]{--c:var(--soon)} .tile[data-k=soon] b{color:var(--soon)}
.tile[data-k=ok]{--c:var(--ok)} .tile[data-k=new]{--c:var(--new)}
.tile:hover{border-color:var(--c)}
.tile.active{border-color:var(--c);box-shadow:0 0 0 1px var(--c)}
.tile.need{--c:var(--accent);border:2px solid var(--accent)}
.tile.need::before{display:none}
.tile.need b,.tile.need span{color:var(--accent)}
.tile.need.active{background:var(--accent);box-shadow:none}
.tile.need.active b,.tile.need.active span{color:var(--accent-ink)}
.tile.need span{font-weight:800}
@media (max-width:520px){.band{grid-template-columns:repeat(2,minmax(0,1fr))}.tile.need{grid-column:1/-1}}

nav.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
nav.tabs button{all:unset;cursor:pointer;padding:9px 12px 10px;font-weight:600;font-size:14px;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs button:focus-visible{outline:2px solid var(--accent)}
nav.tabs button[data-tab="today"]{text-transform:uppercase;font-weight:800;letter-spacing:.04em;border:2px solid var(--accent);border-radius:8px;padding:7px 14px;margin:0 12px 6px 0;color:var(--accent);background:var(--surface)}
nav.tabs button[data-tab="today"][aria-selected=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
@media (max-width:560px){nav.tabs button[data-tab="today"]{flex-basis:100%;text-align:center;margin:0 0 2px;padding:10px 14px}}
#view{display:flex;flex-direction:column;gap:18px}
@media (max-width:560px){nav.tabs{flex-wrap:wrap;overflow:visible;border-bottom:0;gap:6px}nav.tabs button{padding:8px 13px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}nav.tabs button[aria-selected=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}}

.section{display:flex;flex-direction:column;gap:10px}
.sec-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.sec-head h2{margin:0;font-family:var(--f-display);font-stretch:85%;font-weight:700;font-size:19px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink)}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:6px minmax(0,1fr) auto;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.strip{background:var(--c)}
.strip.hatch{background:repeating-linear-gradient(135deg,var(--c) 0 3px,transparent 3px 7px)}
.row[data-s=over]{--c:var(--over)} .row[data-s=soon]{--c:var(--soon)} .row[data-s=ok]{--c:var(--ok)} .row[data-s=new]{--c:var(--new)} .row[data-s=opt]{--c:var(--line)}
.main{padding:11px 12px 11px 14px;min-width:0;display:flex;flex-direction:column;gap:3px}
.name{font-weight:600;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--muted)}
.meta .mono{font-family:var(--f-mono);font-size:12px}
.pill{display:inline-flex;align-items:center;font-family:var(--f-display);font-stretch:85%;font-weight:700;font-size:11px;letter-spacing:.07em;text-transform:uppercase;padding:2px 7px;border-radius:4px;background:var(--cs);color:var(--c)}
.row[data-s=over] .pill{--cs:var(--over-soft)} .row[data-s=soon] .pill{--cs:var(--soon-soft)} .row[data-s=ok] .pill{--cs:var(--ok-soft)} .row[data-s=new] .pill{--cs:var(--new-soft)} .row[data-s=opt] .pill{--cs:var(--sunk);--c:var(--muted)}
.lastnote{font-size:12.5px;color:var(--muted);font-style:italic;overflow-wrap:anywhere}
.act{display:flex;align-items:center;padding:8px 12px 8px 4px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.danger{color:var(--over)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.done{display:inline-flex;align-items:center;gap:6px}
.btn.done svg{width:15px;height:15px}

.panel{grid-column:1/-1;background:var(--sunk);padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;border-top:1px dashed var(--line)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:7px 9px;min-width:0}
.field.grow{flex:1 1 220px}
.field input[type=date]{font-family:var(--f-mono);font-size:13.5px}
.panel .hint{flex-basis:100%;font-size:12.5px;color:var(--muted)}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:22px 18px;color:var(--muted);text-align:center}
.empty strong{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

.hist-day h3{margin:0 0 6px;font-family:var(--f-mono);font-weight:500;font-size:13px;color:var(--muted)}
.hrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 12px;border-top:1px solid var(--line)}
.hrow:first-child{border-top:0}
.init{font-family:var(--f-mono);font-weight:500;font-size:12px;background:var(--accent-soft);color:var(--ink);border-radius:5px;padding:2px 6px}
.hrow .t{font-weight:600;overflow-wrap:anywhere}
.hrow .n{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.hrow .grp{font-size:11px;font-family:var(--f-display);font-stretch:85%;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}

.setup-row{display:grid;grid-template-columns:auto auto minmax(0,1fr) 130px auto;gap:8px;align-items:center;padding:8px 10px;border-top:1px solid var(--line)}
.setup-row:first-child{border-top:0}
.setup-row input,.setup-row select{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:6px 8px;min-width:0;width:100%}
.setup-row .sw input{border:0;padding:0}
.setup-row textarea.nm{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:6px 8px;min-width:0;width:100%;resize:none;overflow:hidden;font:inherit;line-height:1.35;display:block}
.setup-row.is-off [data-rename],.setup-row.is-off select{color:var(--muted)}
@media (max-width:620px){.setup-row{grid-template-columns:auto auto minmax(0,1fr) auto}.setup-row [data-rename]{grid-column:3/-1}.setup-row select[data-freq]{grid-column:1/4}}
.grip{all:unset;box-sizing:border-box;cursor:grab;touch-action:none;display:grid;place-items:center;width:30px;height:36px;margin:-2px -4px -2px -6px;border-radius:6px;color:var(--muted)}
.grip:hover{color:var(--ink);background:var(--sunk)}
.grip:focus-visible{color:var(--ink);outline:2px solid var(--accent);outline-offset:-2px}
.grip svg{width:14px;height:18px;fill:currentColor;pointer-events:none}
.setup-row.dragging{position:relative;z-index:2;background:var(--surface);box-shadow:0 8px 24px rgba(0,0,0,.2);border-radius:8px;outline:2px solid var(--accent);outline-offset:-2px}
body.is-dragging,body.is-dragging *{cursor:grabbing!important;user-select:none;-webkit-user-select:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:12px}
.chip{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-mono);font-weight:500;background:var(--accent-soft);border-radius:6px;padding:4px 4px 4px 9px}
.chip button{all:unset;cursor:pointer;width:30px;height:30px;font-size:16px;display:grid;place-items:center;border-radius:4px;color:var(--muted)}
.chip button:hover{background:var(--surface);color:var(--over)}
.addline{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;padding:12px;border-top:1px solid var(--line);background:var(--sunk)}
.note{font-size:13px;color:var(--muted)}
.modal{position:fixed;inset:0;z-index:40;background:rgba(8,20,22,.45);display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.dlg{width:min(420px,100%);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-top:4px solid var(--over);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:10px;box-shadow:0 18px 48px rgba(0,0,0,.3)}
.dlg h3{margin:0;font-family:var(--f-display);font-stretch:85%;font-weight:800;font-size:21px}
.dlg p{margin:0;font-size:14px;color:var(--muted)}
.dlg-actions{justify-content:flex-end;margin-top:6px}
.btn.danger.solid{background:var(--over);border-color:var(--over);color:var(--bg)}
.btn.danger.solid:disabled{opacity:.6}
.io{display:flex;flex-direction:column;gap:6px;padding:12px;border-top:1px solid var(--line)}
.io:first-child{border-top:0}
.io .note{margin:0}
.io label.btn{cursor:pointer;display:inline-flex;align-items:center}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.vh:focus-visible+label.btn{outline:2px solid var(--accent);outline-offset:2px}
.imp{margin-top:6px;background:var(--sunk);border:1px dashed var(--accent);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px}
.imp ul{margin:0;padding-left:18px;font-size:13.5px;display:flex;flex-direction:column;gap:2px}
.chk{display:flex;gap:8px;align-items:center;font-size:13.5px;cursor:pointer}
.chk input{accent-color:var(--over);margin:0}
.themerow{padding:8px 12px}
.themeseg{display:inline-flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:999px;background:var(--sunk);flex-wrap:wrap}
.themeseg button{border:0;background:transparent;color:var(--ink);font:inherit;font-weight:600;font-size:14px;padding:8px 14px;border-radius:999px;min-height:38px;cursor:pointer}
.themeseg button[aria-checked="true"]{background:var(--accent);color:var(--accent-ink)}
.daychip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;font-weight:600;cursor:pointer;background:var(--surface)}
.daychip:has(input:checked){background:var(--accent-soft);border-color:var(--accent)}
.daychip input{accent-color:var(--accent);margin:0}
.tdays{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:0 0 2px 100px}
.tdl{font-size:12px;font-weight:600;color:var(--muted);margin-right:2px}
.daychip.sm{padding:3px 9px;font-size:13px;gap:5px;border-radius:7px}
.note.warn{color:var(--soon);flex-basis:100%;margin:2px 0 0}
@media (max-width:620px){.tdays{padding-left:0}}
.house summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--muted)}
.rule-row{display:grid;grid-template-columns:110px minmax(0,1fr) minmax(0,1fr);gap:10px 14px;align-items:end;padding:10px 12px;border-top:1px solid var(--line)}
.rule-row:first-child{border-top:0}
.rule-name{font-weight:600;padding-bottom:7px}
.pair{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rule-row input,.rule-row select{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:6px 8px}
.pair input{width:72px;font-family:var(--f-mono)}
@media (max-width:520px){.rule-row{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px 12px;padding:12px}.rule-name{grid-column:1/-1;padding-bottom:2px;font-size:15px}.pair{flex-wrap:nowrap;gap:5px}.pair input{width:54px;flex:none;text-align:center}.pair select{flex:1;min-width:0;padding:6px 6px}.rule-row .pair .note{white-space:nowrap;font-size:12.5px}}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 12px 10px 16px;display:flex;gap:12px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px);z-index:20}
#toast button{all:unset;cursor:pointer;font-weight:700;color:var(--accent-soft);padding:2px 6px}
.mini{display:inline-flex;align-items:center;gap:6px}
.mini select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:2px 6px;font-size:12.5px}
.act.wide{gap:8px;flex-wrap:wrap;justify-content:flex-end}
.act select{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 8px}
.sw{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;min-width:62px}
.sw input{appearance:none;-webkit-appearance:none;width:36px;height:21px;border-radius:999px;background:var(--line);position:relative;margin:0;cursor:pointer;flex:none}
.sw input::after{content:"";position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw input:checked{background:var(--accent)}
.sw input:checked::after{transform:translateX(15px)}
@media (prefers-reduced-motion:no-preference){.sw input,.sw input::after{transition:all .15s}}
@media (max-width:560px){.row .act.wide{grid-column:2/-1;justify-content:flex-start;padding:0 12px 10px 14px}}
.confirm{display:inline-flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
@media (prefers-reduced-motion:no-preference){.panel{animation:drop .16s ease-out}@keyframes drop{from{opacity:.4;transform:translateY(-3px)}}}
#signin{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));overflow:auto}
.sg-card{width:min(380px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px 22px;display:flex;flex-direction:column;gap:16px;box-shadow:0 12px 32px rgba(0,0,0,.08)}
.sg-brand{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px}
.sg-brand .logo{margin:0 0 6px}
.sg-brand .logo img{height:96px;width:auto;margin:0 auto}
.sg-brand h1{margin:0;font-family:var(--f-display);font-stretch:80%;font-weight:800;font-size:28px;line-height:1.05}
.sg-brand p{margin:0;color:var(--muted);font-size:14px}
#signinForm{display:flex;flex-direction:column;gap:10px}
#signinForm label{font-size:13px;font-weight:600;color:var(--muted)}
#signinForm input{border:1px solid var(--line);background:var(--sunk);border-radius:9px;padding:11px 12px;font-size:16px}
#signinForm button{min-height:44px;font-size:15px}
#signinMsg{min-height:1.2em;margin:0;color:var(--over);font-size:13.5px;font-weight:600}
.sg-note{margin:0;font-size:12.5px;color:var(--muted)}
</style>

</head>

  <p id="signinMsg" role="alert"></p><p class="sg-note">This device stays signed in for 90 days. Sign out under Setup.</p></div></div>

<script>
/* ---------- hosted data store: talks to api.php, signs in with the office password ---------- */
window.TDC=(function(){
  const API="api.php";
  let lastRev=-1,signedOutHook=null,pollT=null,refreshT=null,busy=false;
  const listeners=new Set();
  function E(code,message){return {code,message}}
  /* Shared hosting allows only a few database connections at once, so a "busy" answer
     is retried. "add" is only retried when the server never reached the database. */
  async function call(op,payload){
    for(let attempt=0;;attempt++){
      try{return await call1(op,payload)}
      catch(e){
        const busy=e.code==="db_busy"||e.code==="db_connect"||(e.code==="unavailable"&&op!=="add"&&op!=="login");
        if(!busy||attempt>=3)throw e.code==="db_busy"||e.code==="db_connect"?E("unavailable","The server was busy and couldn't save. Try again in a moment."):e;
        await new Promise(r=>setTimeout(r,400*(attempt+1)+Math.random()*300));
      }
    }
  }
  async function call1(op,payload){
    let r,j;
    try{r=await fetch(API,{method:"POST",credentials:"same-origin",cache:"no-store",headers:{"Content-Type":"application/json","X-TDC":"1"},body:JSON.stringify({op,...(payload||{})})})}
    catch(e){throw E("unavailable","No connection to the server.")}
    try{j=await r.json()}catch(e){throw E("unavailable","The server sent an unexpected reply.")}
    if(!j||!j.ok){
      const err=(j&&j.error)||"unavailable";
      if(err==="signed_out"&&signedOutHook)signedOutHook();
      const map={invalid_argument:"invalid_argument",too_large:"invalid_argument",signed_out:"signed_out",not_configured:"not_configured",wrong_password:"wrong_password",too_many:"too_many",db_busy:"db_busy",db_connect:"db_connect"};
      throw E(map[err]||"unavailable",(j&&j.message)||"Something went wrong.");
    }
    if(typeof j.rev==="number"&&j.rev>lastRev)lastRev=j.rev;
    return j;
  }
  const meta={fromCache:false,hasPendingWrites:false};
  const docSnap=(id,exists,data)=>({id,exists,data:()=>exists?data:undefined,metadata:meta});
  const qSnap=docs=>({docs,size:docs.length,empty:!docs.length,docChanges:()=>[],metadata:meta});
  function split(path){const p=String(path).split("/");if(p.length!==2)throw new TypeError("Document paths look like collection/id");return p}

  function runListener(L){
    const p=L.kind==="doc"
      ?call("get",{col:L.col,id:L.id}).then(j=>docSnap(L.id,j.exists,j.data||{}))
      :call("query",{col:L.col,where:L.q.where,orderBy:L.q.orderBy,limit:L.q.limit}).then(j=>qSnap(j.docs.map(d=>docSnap(d.id,true,d.data))));
    return p.then(s=>{if(listeners.has(L))L.next(s)},e=>{if(listeners.has(L)&&L.err)L.err(e)});
  }
  function readOf(L){return L.kind==="doc"?{kind:"get",col:L.col,id:L.id}:{kind:"query",col:L.col,where:L.q.where,orderBy:L.q.orderBy,limit:L.q.limit}}
  function deliver(L,res){if(!listeners.has(L))return;if(L.kind==="doc")L.next(docSnap(L.id,res.exists,res.data||{}));else L.next(qSnap(res.docs.map(d=>docSnap(d.id,true,d.data))))}
  function refreshAll(){
    if(busy)return refreshSoon();busy=true;
    const Ls=[...listeners];
    return call("multi",{reads:Ls.map(readOf)}).then(j=>{Ls.forEach((L,i)=>deliver(L,j.results[i]))},e=>{for(const L of Ls)if(listeners.has(L)&&L.err)L.err(e)}).finally(()=>{busy=false});
  }
  function refreshSoon(){clearTimeout(refreshT);refreshT=setTimeout(refreshAll,60)}
  async function poll(){
    try{const j=await call("rev");if(j.rev!==undefined&&j.rev!==pollRev){pollRev=j.rev;await refreshAll()}}
    catch(e){for(const L of listeners)if(L.err&&L.kind==="query"&&L.col==="tasks")L.err(e)}
  }
  let pollRev=-1;
  function schedule(){clearTimeout(pollT);pollT=setTimeout(async()=>{await poll();schedule()},document.visibilityState==="visible"?6000:30000)}
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){poll();schedule()}});
  window.addEventListener("online",()=>{poll()});

  async function write(op,payload){const j=await call(op,payload);pollRev=lastRev;refreshSoon();return j}
  function docRef(col,id){
    return {id,path:col+"/"+id,
      get:()=>call("get",{col,id}).then(j=>docSnap(id,j.exists,j.data||{})),
      set:d=>write("set",{col,id,data:d}).then(()=>{}),
      update:d=>write("update",{col,id,data:d}).then(()=>{}),
      delete:()=>write("delete",{col,id}).then(()=>{}),
      onSnapshot(next,err){const L={kind:"doc",col,id,next,err};listeners.add(L);refreshSoon();return()=>listeners.delete(L)}};
  }
  function query(col,q){
    return {path:col,
      where:(f,op,v)=>query(col,{...q,where:[...q.where,[f,op,v]]}),
      orderBy:(f,dir)=>query(col,{...q,orderBy:[f,dir||"asc"]}),
      limit:n=>query(col,{...q,limit:n}),
      get:()=>call("query",{col,where:q.where,orderBy:q.orderBy,limit:q.limit}).then(j=>qSnap(j.docs.map(d=>docSnap(d.id,true,d.data)))),
      onSnapshot(next,err){const L={kind:"query",col,q,next,err};listeners.add(L);refreshSoon();return()=>listeners.delete(L)},
      doc:id=>docRef(col,id),
      add:d=>write("add",{col,data:d}).then(j=>docRef(col,j.id))};
  }
  const db={collection:c=>query(c,{where:[],orderBy:null,limit:1000}),doc:p=>{const [c,id]=split(p);return docRef(c,id)}};

  const downloads={async save({filename,data}){
    const blob=data instanceof Blob?data:new Blob([data],{type:/\.json$/i.test(filename)?"application/json":/\.csv$/i.test(filename)?"text/csv":"application/octet-stream"});
    const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);return {status:"saved"}}};

  /* ---------- sign-in screen ---------- */
  function gate(){
    const el=document.getElementById("signin"),form=document.getElementById("signinForm"),pw=document.getElementById("signinPw"),msg=document.getElementById("signinMsg"),btn=form.querySelector("button");
    const logo=document.querySelector("header .logo");if(logo&&!el.querySelector(".logo"))el.querySelector(".sg-brand").prepend(logo.cloneNode(true));
    return new Promise(resolve=>{
      el.hidden=false;setTimeout(()=>pw.focus(),50);
      form.onsubmit=async ev=>{ev.preventDefault();msg.textContent="";btn.disabled=true;btn.textContent="Signing in…";
        try{await call("login",{password:pw.value});pw.value="";el.hidden=true;resolve()}
        catch(e){msg.textContent=e.message||"Couldn't sign in. Try again.";pw.select()}
        finally{btn.disabled=false;btn.textContent="Sign in"}};
    });
  }
  async function signIn(){
    let st;
    for(;;){
      try{st=await call("status");break}
      catch(e){
        const el=document.getElementById("signin");el.hidden=false;
        document.getElementById("signinMsg").textContent=e.code==="not_configured"?e.message:"Can't reach the server. Retrying…";
        document.getElementById("signinForm").hidden=e.code==="not_configured";
        await new Promise(r=>setTimeout(r,5000));
      }
    }
    document.getElementById("signinForm").hidden=false;document.getElementById("signinMsg").textContent="";
    if(!st.signedIn)await gate();
    signedOutHook=(function hook(){return async()=>{signedOutHook=null;await gate();signedOutHook=hook();refreshAll()}})();
    schedule();
  }
  async function batch(writes){for(let i=0;i<writes.length;i+=150){await call("batch",{writes:writes.slice(i,i+150)})}pollRev=lastRev;refreshSoon()}
  async function logout(){try{await call("logout")}catch(e){}location.reload()}
  return {db,downloads,signIn,logout,batch};
})();
</script>
<script>
(function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LISTS=[{k:"daily",label:"Daily",title:"Daily"},{k:"weekly",label:"Weekly",title:"Weekly"},{k:"monthly",label:"Monthly",title:"Monthly"},{k:"quarterly",label:"Quarterly",title:"Quarterly"},{k:"yearly",label:"Yearly",title:"Yearly"}];
const FREQS=["Daily","Weekly","Monthly","Quarterly","Yearly"];
const DEF_RULE={Daily:{d:1,soon:0},Weekly:{d:7,soon:2},Monthly:{m:1,soon:7},Quarterly:{m:3,soon:14},Yearly:{m:12,soon:30}};

/* ---------- dates ---------- */
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const todayISO=()=>iso(new Date());
function addRule(d,r){const x=new Date(d);if(r.d)x.setDate(x.getDate()+r.d);if(r.m){const day=x.getDate();x.setDate(1);x.setMonth(x.getMonth()+r.m);const last=new Date(x.getFullYear(),x.getMonth()+1,0).getDate();x.setDate(Math.min(day,last));}return x}
const dayDiff=(a,b)=>Math.round((parse(iso(b))-parse(iso(a)))/864e5);
const DAYN=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function openDays(){const d=S.clinic;return Array.isArray(d)&&d.length?d:[0,1,2,3,4,5,6]}
function isOpen(d){return openDays().includes(d.getDay())}
function nextDue(last,rule,days){const ok=days||openDays();const x=addRule(last,rule);for(let i=0;i<14&&!ok.includes(x.getDay());i++)x.setDate(x.getDate()+1);return x}
/* Daily tasks can be limited to some clinic days (task.days). No days, or every clinic day, means every clinic day. */
const WEEK=[1,2,3,4,5,6,0];
const ownDays=t=>t.freq==="Daily"&&Array.isArray(t.days)&&t.days.length?t.days:null;
function taskDays(t){const od=openDays(),d=ownDays(t);if(!d)return od;const k=od.filter(x=>d.includes(x));return k.length?k:od}
const daysLost=t=>{const d=ownDays(t);return !!d&&!openDays().some(x=>d.includes(x))};
const hasOwnDays=t=>!!ownDays(t)&&!daysLost(t)&&openDays().some(x=>!t.days.includes(x));
const daysText=(days,sep)=>WEEK.filter(d=>days.includes(d)).map(d=>DAYN[d]).join(sep);
const DAYS_OK=v=>{const s=String(v||"").trim().toLowerCase();if(!s||/^(every|all|daily|any)/.test(s))return null;const out=new Set();
  for(const w of s.split(/[^a-z]+/))if(w.length>=2){const i=DAYN.findIndex(n=>n.toLowerCase().startsWith(w.slice(0,3)));if(i>=0)out.add(i)}
  return out.size?[...out].sort((a,b)=>a-b):null};
const logName=e=>e.taskId?((S.tasks.find(t=>t.id===e.taskId)||{}).name||"Removed task"):`All ${e.scope} tasks`;
const allLog=()=>{const m=new Map();for(const e of [...S.older,...S.log])m.set(e.id,e);return [...m.values()]};
const fmt=s=>{if(!s)return"";return parse(s).toLocaleDateString(undefined,{month:"short",day:"numeric"})};
const fmtLong=s=>parse(s).toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric",year:"numeric"});

/* ---------- status ---------- */
function lastFor(t){
  let best=null;
  const rz=S.resets[t.list]||"";
  for(const e of S.log){ if((e.at||"")<rz)continue; if(e.taskId===t.id||(!e.taskId&&e.scope===t.list&&(!e.taskIds||e.taskIds.includes(t.id)))){ if(!best||e.date>best.date||(e.date===best.date&&(e.at||"")>(best.at||"")))best=e; } }
  const f=t.lastDone; if(f&&f.date&&(!rz||(f.at||"")>=rz)&&(!best||f.date>best.date))best=f;
  return best;
}
function statusOf(t){
  if(t.off||t.freq==="Optional"||!RULE[t.freq])return{s:"opt",label:t.list==="optional"?"Off":"Optional"};
  const last=lastFor(t); if(!last)return{s:"new",label:S.resets[t.list]?"Not done since reset":"Never logged",last:null};
  const next=nextDue(parse(last.date),RULE[t.freq],t.freq==="Daily"?taskDays(t):null); const diff=dayDiff(new Date(),next);
  let s,label;
  if(diff<0){s="over";label="Overdue"}else if(diff<=RULE[t.freq].soon){s="soon";label=diff===0?"Due today":"Due soon"}else{s="ok";label="On track"}
  return{s,label,last,next:iso(next),diff};
}
const sorted=()=>S.tasks.slice().sort((a,b)=>(a.order??0)-(b.order??0));
const FRANK={Daily:0,Weekly:1,Monthly:2,Quarterly:3,Yearly:4};
const byFreq=(a,b)=>((FRANK[a.trackFreq||"Monthly"]??2)-(FRANK[b.trackFreq||"Monthly"]??2))||((a.order??0)-(b.order??0));

function tone(f,t0,dur,type,vol){const o=AC.createOscillator(),g=AC.createGain();o.type=type||"sine";o.frequency.setValueAtTime(f,t0);g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(vol||.18,t0+.015);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+dur+.05)}
const SOUNDS=[
  t=>[523.25,659.25,783.99].forEach((f,i)=>tone(f,t+i*.09,.35)),
  t=>{tone(1318.5,t,.9,"sine",.15);tone(2637,t,.6,"sine",.05)},
  t=>{tone(880,t,.12,"triangle");tone(1174.66,t+.11,.2,"triangle")},
  t=>[1567.98,2093,2637,3135.96].forEach((f,i)=>tone(f,t+i*.05,.25,"sine",.08)),
  t=>{tone(392,t,.12,"square",.05);tone(392,t+.13,.12,"square",.05);tone(523.25,t+.26,.45,"square",.06)},
  t=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(400,t);o.frequency.exponentialRampToValueAtTime(1200,t+.18);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.15,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.3);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.35)}
];

/* ---------- writes ---------- */
async function logDone(taskIds,scope,date,note){
  const initials=getMe(); if(!initials){toast("Pick your initials at the top first.");return}
  const db=S.db; if(!db)return;
  const entry={date,initials,note:note||"",at:new Date().toISOString(),by:S.uid||null,taskId:scope?null:taskIds[0],scope:scope||null,...(scope?{taskIds}:{})};
  try{
    const ref=await db.collection("log").add(entry);
    const prev={};
    for(const id of taskIds){
      const t=S.tasks.find(x=>x.id===id); if(!t)continue; prev[id]=t.lastDone||null;
      if(!t.lastDone||!t.lastDone.date||date>=t.lastDone.date){
        await db.doc("tasks/"+id).update({lastDone:{date,initials,note:note||"",logId:ref.id,at:entry.at}});
      }
    }
    S.open=null; render(); playDone();
    const what=scope?`All ${scope} tasks`:(S.tasks.find(x=>x.id===taskIds[0])||{}).name;
    toast(`Logged: ${what} · ${initials}`,async()=>{
      try{await ref.delete();for(const id in prev){await db.doc("tasks/"+id).update({lastDone:prev[id]})}toast("Removed from the log.")}catch(e){toast("Couldn't undo. Try removing it from the completion log.")}
    });
  }catch(e){ writeFail(e) }
}
function writeFail(e){if(e&&e.code&&!["invalid_argument","quota_exceeded"].includes(e.code)){sync("err","Not saved");setTimeout(idle,4000)}
  if(e&&e.code==="invalid_argument"&&!S.canKnown){S.canWrite=false;idle();render();toast("You have view-only access, so changes can't be saved.")}
  else if(e&&e.code==="invalid_argument")toast("That didn't save. Someone may have just changed or removed this item. Check it and try again.");
  else if(e&&e.code==="quota_exceeded")toast("The log is full. Remove old entries before adding more.");
  else toast("That didn't save. Check your connection and try again.");
}
async function removeEntry(id){
  const e=S.log.find(x=>x.id===id); if(!e)return;
  try{
    await S.db.doc("log/"+id).delete();
    const affected=S.tasks.filter(t=>t.lastDone&&t.lastDone.logId===id);
    for(const t of affected){
      const rest=S.log.filter(x=>x.id!==id&&(x.at||"")>=(S.resets[t.list]||"")&&(x.taskId===t.id||(!x.taskId&&x.scope===t.list&&(!x.taskIds||x.taskIds.includes(t.id))))).sort((a,b)=>b.date.localeCompare(a.date));
      const r=rest[0]; await S.db.doc("tasks/"+t.id).update({lastDone:r?{date:r.date,initials:r.initials,note:r.note||"",logId:r.id,at:r.at||""}:null});
    }
    S.confirm=null; toast("Entry removed.");
  }catch(err){writeFail(err)}
}

async function resetList(k){
  const doneNow=S.tasks.filter(t=>t.list===k&&!["new","opt"].includes(statusOf(t).s));
  if(!doneNow.length){S.confirm=null;render();toast(`No ${k} tasks are marked done right now, so there was nothing to reset.`);return}
  try{
    const now=new Date().toISOString();
    await S.db.doc("settings/resets").set({...S.resets,[k]:now});
    for(const t of S.tasks.filter(x=>x.list===k&&x.lastDone)){await S.db.doc("tasks/"+t.id).update({lastDone:null})}
    S.confirm=null;S.open=null;toast(`Reset ${doneNow.length} ${k} task${doneNow.length===1?"":"s"} to not done. Past entries stay in the completion log.`);
  }catch(e){writeFail(e)}
}

async function loadOlder(){let oldest=null;for(const e of allLog())if(e.at&&(!oldest||e.at<oldest))oldest=e.at;if(!oldest)return;
  try{const s=await S.db.collection("log").where("at","<",oldest).orderBy("at","desc").limit(500).get();S.older=S.older.concat(s.docs.map(d=>({id:d.id,...d.data()})));if(s.size<500)S.olderDone=true;render();toast(s.size?`Loaded ${s.size} older entries.`:"No older entries.")}catch(e){toast("Couldn't load older entries. Try again.")}}
async function fetchAllLog(){let out=[],cur=null;for(let i=0;i<50;i++){let q=S.db.collection("log");if(cur)q=q.where("at","<",cur);const s=await q.orderBy("at","desc").limit(1000).get();out=out.concat(s.docs.map(d=>({id:d.id,...d.data()})));if(s.size<1000)break;cur=s.docs[s.docs.length-1].data().at}return out}
async function exportLog(q){if(!S.dl){toast("Downloads aren't available here.");return}
  try{toast("Preparing the export…");let rows=await fetchAllLog();if(q)rows=rows.filter(e=>(logName(e)+" "+e.initials+" "+(e.note||"")).toLowerCase().includes(q));if(!rows.length){toast("No entries match that search.");return}rows.sort((a,b)=>(a.date||"").localeCompare(b.date||"")||(a.at||"").localeCompare(b.at||""));
    const q=v=>{let t=String(v??"");if(/^[=+\-@]/.test(t))t="'"+t;return `"${t.replace(/"/g,'""')}"`};
    const lines=[["Date","Task","Initials","Note","Logged at"].map(q).join(",")].concat(rows.map(e=>[e.date,logName(e),e.initials,e.note||"",e.at||""].map(q).join(",")));
    await S.dl.save({filename:`TDC maintenance log${q?" - "+q.replace(/[^\w ]+/g,"").trim().slice(0,40):""} ${todayISO()}.csv`,data:lines.join("\r\n")});toast(`Exported ${rows.length} entr${rows.length===1?"y":"ies"}${q?" matching \u201c"+q+"\u201d":""}.`)}
  catch(e){if(e&&e.code==="declined")return;toast("The export didn't finish. Try again.")}}
async function clearOld(months){const c=new Date();c.setMonth(c.getMonth()-months);const cut=c.toISOString();let n=0;
  try{for(let i=0;i<100;i++){const s=await S.db.collection("log").where("at","<",cut).limit(200).get();if(!s.size)break;for(const d of s.docs){await S.db.doc("log/"+d.id).delete();n++}if(s.size<200)break}
    S.older=S.older.filter(e=>(e.at||"")>=cut);S.confirm=null;render();toast(n?`Removed ${n} entries older than ${months/12} year${months>12?"s":""}.`:"There's nothing that old to remove.")}catch(e){writeFail(e)}}

/* ---------- import & export ---------- */
const ID_OK=v=>typeof v==="string"&&/^[A-Za-z0-9_\-.~:@+]{1,200}$/.test(v)&&v!=="."&&v!=="..";
const FREQ_OK=f=>FREQS.find(x=>x.toLowerCase()===String(f||"").trim().toLowerCase());
const csvCell=v=>{let t=String(v??"");if(/^[=+\-@]/.test(t))t="'"+t;return `"${t.replace(/"/g,'""')}"`};
const unq=v=>String(v??"").replace(/^'(?=[=+\-@])/,"").trim();
function parseCSV(text){const rows=[];let row=[],cell="",q=false;text=text.replace(/^﻿/,"");
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cell+='"';i++}else q=false}else cell+=c}
    else if(c==='"')q=true;else if(c===","){row.push(cell);cell=""}
    else if(c==="\n"||c==="\r"){if(c==="\r"&&text[i+1]==="\n")i++;row.push(cell);rows.push(row);row=[];cell=""}
    else cell+=c}
  if(cell!==""||row.length){row.push(cell);rows.push(row)}
  return rows.filter(r=>r.some(x=>x.trim()!==""))}
async function exportBackup(){if(!S.dl){toast("Downloads aren't available here.");return}
  try{toast("Preparing the backup…");const log=await fetchAllLog();
    const data={app:"TDC Maintenance Tracker",kind:"backup",version:1,exportedAt:new Date().toISOString(),tasks:S.tasks.map(t=>({...t})),settings:{team:S.team,clinic:S.clinic,rules:S.rulesRaw,resets:S.resets},log};
    await S.dl.save({filename:`TDC maintenance backup ${todayISO()}.json`,data:JSON.stringify(data,null,1)});
    toast(`Backup saved: ${data.tasks.length} tasks and ${log.length} log entr${log.length===1?"y":"ies"}.`)}
  catch(e){if(e&&e.code==="declined")return;toast("The backup didn't finish. Try again.")}}
async function exportTasks(){if(!S.dl){toast("Downloads aren't available here.");return}
  const ts=S.tasks.slice().sort((a,b)=>{const fa=a.freq==="Optional"?(a.trackFreq||"Monthly"):a.freq,fb=b.freq==="Optional"?(b.trackFreq||"Monthly"):b.freq;return ((FRANK[fa]??9)-(FRANK[fb]??9))||((a.order??0)-(b.order??0))});
  const lines=[["Task","Frequency","Status","Days"].map(csvCell).join(",")].concat(ts.map(t=>[t.name,t.freq==="Optional"?(t.trackFreq||"Monthly"):t.freq,(t.off||t.freq==="Optional")?"Off":"On",hasOwnDays(t)?daysText(taskDays(t)," "):""].map(csvCell).join(",")));
  try{await S.dl.save({filename:`TDC task list ${todayISO()}.csv`,data:lines.join("\r\n")});toast(`Exported ${ts.length} tasks.`)}
  catch(e){if(e&&e.code==="declined")return;toast("The export didn't finish. Try again.")}}
async function planImport(file){
  let text;try{text=await file.text()}catch(e){toast("Couldn't read that file.");return}
  const name=file.name||"file";
  if(/\.json$/i.test(name)||/^\s*\{/.test(text)){
    let d;try{d=JSON.parse(text)}catch(e){toast("That file isn't a valid tracker backup.");return}
    if(!d||!Array.isArray(d.tasks)){toast("That file isn't a tracker backup.");return}
    const tasks=d.tasks.filter(t=>t&&ID_OK(t.id)&&typeof t.name==="string"&&t.name.trim()&&typeof t.freq==="string");
    if(!tasks.length){toast("That backup has no tasks in it.");return}
    const have=new Set(S.tasks.map(t=>t.id)),inFile=new Set(tasks.map(t=>t.id));
    const log=(Array.isArray(d.log)?d.log:[]).filter(e=>e&&ID_OK(e.id)&&typeof e.date==="string");
    S.imp={kind:"backup",file:name,tasks,log,settings:(d.settings&&typeof d.settings==="object")?d.settings:{},
      newT:tasks.filter(t=>!have.has(t.id)).length,upd:tasks.filter(t=>have.has(t.id)).length,extra:S.tasks.filter(t=>!inFile.has(t.id)).length,exportedAt:typeof d.exportedAt==="string"?d.exportedAt:""};
  }else{
    const rows=parseCSV(text);if(!rows.length){toast("That file is empty.");return}
    const head=rows[0].map(h=>unq(h).toLowerCase());
    let ti=head.findIndex(h=>["task","task name","name"].includes(h)),fi=head.findIndex(h=>["frequency","freq"].includes(h)),si=head.findIndex(h=>["status","on/off","on"].includes(h)),di=head.findIndex(h=>["days","day","days of week"].includes(h));
    let body=rows.slice(1);if(ti<0){ti=0;fi=1;si=2;di=3;body=rows}
    const byName=new Map(S.tasks.map(t=>[t.name.trim().toLowerCase(),t]));const seen=new Set();
    const items=[];let skipped=0;
    for(const r of body){const nm=unq(r[ti]).replace(/\s+/g," ").slice(0,120);if(!nm||seen.has(nm.toLowerCase()))continue;seen.add(nm.toLowerCase());
      const raw=fi>=0?unq(r[fi]):"";const f=FREQ_OK(raw);if(raw&&!f){skipped++;continue}
      const st=si>=0?unq(r[si]).toLowerCase():"";const off=/^(off|no|n|false|0)$/.test(st)?true:/^(on|yes|y|true|1)$/.test(st)?false:null;
      const days=di>=0&&r.length>di?DAYS_OK(unq(r[di])):undefined;
      const ex=byName.get(nm.toLowerCase());items.push({name:nm,freq:f||null,off,days,ex:ex?ex.id:null})}
    if(!items.length&&!skipped){toast("No tasks found in that file. It needs a Task column.");return}
    S.imp={kind:"csv",file:name,items,newT:items.filter(i=>!i.ex).length,upd:items.filter(i=>i.ex).length,skipped};
  }
  S.impRemove=false;render();

  for(const k in c){$("#t-"+k+" b").textContent=c[k]}
  $("#t-all b").textContent=c.over+c.soon+c.new;
  document.querySelectorAll(".band .tile").forEach(t=>{const k=t.dataset.k;t.classList.toggle("active",S.tab==="today"&&(k==="all"?!S.filter:S.filter===k))});
}
function renderSetupBtn(){for(const [id,t] of [["setupbtn","setup"],["logbtn","history"]]){const b=document.getElementById(id);if(b)b.setAttribute("aria-pressed",String(S.tab===t))}}
function renderTabs(){renderSetupBtn();
  $("#tabs").innerHTML=TABS.map(([k,l])=>`<button role="tab" data-tab="${k}" aria-selected="${S.tab===k}">${l}</button>`).join("");
}
function fitTa(t){t.style.height="auto";t.style.height=t.scrollHeight+"px"}
function render(){
  if(S.drag){S.dragPend=true;return}
  $("#today").textContent=fmtLong(todayISO());
  renderTabs();
  if(!S.db){$("#view").innerHTML=`<div class="empty"><strong>Signing in…</strong>Your checklist appears here once you are signed in.</div>`;return}
  if(!(S.loaded.t&&S.loaded.l&&S.loaded.s))return;
  renderBand();
  const active=document.activeElement; const fid=active&&active.id; let sel=null;try{sel=fid?active.selectionStart:null}catch(e){}
  const keep={};document.querySelectorAll("#view input[id]:not([type=file]),#view select[id]").forEach(el=>{keep[el.id]=el.value});
  let h="";
  if(!S.tasks.length&&S.tab!=="setup"&&S.tab!=="history")h=`<div class="empty"><strong>No tasks yet</strong>Add your checklist under Setup, or import one under Setup → Import & export.</div>`;
  else if(S.tab==="today")h=viewToday();
  else if(S.tab==="history")h=viewHistory();
  else if(S.tab==="setup")h=viewSetup();
  else h=listSection(S.tab,null);
  if(!getMe()&&S.canWrite&&S.tab!=="setup")h=`<div class="empty" style="text-align:left"><strong>Who's logging?</strong>Pick your initials in the top corner. This device remembers them.</div>`+h;
  $("#view").innerHTML=h;
  document.querySelectorAll("#view textarea.nm").forEach(fitTa);
  for(const id in keep){const el=document.getElementById(id);if(el&&!el.dataset.rename&&!el.dataset.freq&&!el.dataset.move&&!el.dataset.track&&id!=="hq"&&(!id.startsWith("rl-")||id===fid))el.value=keep[id]}
  if(fid){const el=document.getElementById(fid);if(el){el.focus();try{if(sel!=null)el.setSelectionRange(sel,sel)}catch(e){}}}
}

/* ---------- events ---------- */
document.addEventListener("click",async ev=>{
  const b=ev.target.closest("button"); if(!b)return;
  if("signout" in b.dataset){TDC.logout();return}
  if("expbackup" in b.dataset){exportBackup();return}
  if("exptasks" in b.dataset){exportTasks();return}
  if("impgo" in b.dataset){applyImport();return}
  if("impcancel" in b.dataset){S.imp=null;S.impRemove=false;render();return}
  if(b.id==="themeBtn"){const next=curTheme()==="dark"?"light":"dark";try{localStorage.setItem("tdc-theme",next)}catch(e){}applyTheme();renderThemeBtn();toast(next==="dark"?"Dark mode on.":"Light mode on.");return}
  if(b.id==="snd"){const on=!soundOn();try{localStorage.setItem("tdc-sound",on?"on":"off")}catch(e){}renderSnd();if(on){primeAudio();playDone()}return}
  if(b.dataset.tab){S.tab=b.dataset.tab;S.open=null;S.confirm=null;if(b.dataset.tab!=="today")S.filter=null;try{history.replaceState(null,"","#"+b.dataset.tab)}catch(e){}render();return}
  if(b.classList.contains("tile")){S.tab="today";S.open=null;S.confirm=null;S.filter=b.dataset.k==="all"?null:(S.filter===b.dataset.k?null:b.dataset.k);render();return}
  if("clear" in b.dataset){S.filter=null;render();return}
  if(b.dataset.open){S.open=S.open===b.dataset.open?null:b.dataset.open;render();const f=document.querySelector(`[data-log="${S.open}"] input[type=text],[data-log="${S.open}"] .grow input`);if(f)f.focus();return}
  if("clearall" in b.dataset){clearAllTasks();return}
  if("resetall" in b.dataset){resetAllTasks();return}
  if(b.dataset.ask){S.confirm=b.dataset.ask;render();{const n=document.getElementById(b.dataset.ask==="clearall"?"clrNo":"rstNo");if(n&&(b.dataset.ask==="clearall"||b.dataset.ask==="resetall"))n.focus()}return}
  if("cancel" in b.dataset){S.confirm=null;render();return}
  if("ruledef" in b.dataset){try{await S.db.doc("settings/rules").set({});toast("Default schedule rules restored.")}catch(e){writeFail(e)}return}
  if("exportlog" in b.dataset){exportLog(S.hist.trim().toLowerCase());return}
  if("older" in b.dataset){loadOlder();return}
  if("clearold" in b.dataset){clearOld(+$("#oldm").value);return}
  if(b.dataset.reset){resetList(b.dataset.reset);return}
  if(b.dataset.del){removeEntry(b.dataset.del);return}
  if(b.dataset.deltask){try{await S.db.doc("tasks/"+b.dataset.deltask).delete();S.confirm=null;toast("Task deleted. Its past log entries stay in the history.")}catch(e){writeFail(e)}return}
  if(b.dataset.rmteam){const team=S.team.filter(x=>x!==b.dataset.rmteam);try{await S.db.doc("settings/team").set({initials:team})}catch(e){writeFail(e)}return}
});
document.addEventListener("submit",async ev=>{
  ev.preventDefault(); const f=ev.target;
  if(f.dataset.log){
    primeAudio();
    const key=f.dataset.log; const date=f.querySelector("#d-"+CSS.escape(key)).value||todayISO();
    const ini=f.querySelector("#i-"+CSS.escape(key)).value; if(ini&&ini!==getMe()){setMe(ini);renderWho()}
    const note=f.querySelector("#n-"+CSS.escape(key)).value.trim();
    f.querySelector("button[type=submit]").disabled=true;
    if(key.startsWith("all-")){const scope=key.slice(4);await logDone(S.tasks.filter(t=>t.list===scope&&t.freq!=="Optional"&&!t.off).map(t=>t.id),scope,date,note)}
    else await logDone([key],null,date,note);
    return;
  }
  if(f.id==="addteam"){const inp=$("#newinit");const v=inp.value.trim().toUpperCase();if(!v)return;if(S.team.includes(v)){toast(`${v} is already on the team.`);return}inp.value="";try{await S.db.doc("settings/team").set({initials:[...S.team,v]});toast(`Added ${v}.`)}catch(e){const i=$("#newinit");if(i)i.value=v;writeFail(e)}return}
  if(f.dataset.addtask){const k=f.dataset.addtask;const name=$("#new-"+k).value.trim();if(!name)return;const freq=$("#newf-"+k).value;$("#new-"+k).value="";
    const max=Math.max(0,...S.tasks.map(t=>t.order||0));
    try{await S.db.collection("tasks").add({name,list:freq==="Optional"?"optional":freq.toLowerCase(),freq,order:max+1});toast(`Task added to ${freq}.`)}catch(e){const i=$("#new-"+k);if(i)i.value=name;writeFail(e)}}
});
document.addEventListener("change",async ev=>{
  const el=ev.target;
  if(el.id==="impfile"){const f=el.files&&el.files[0];el.value="";if(f)planImport(f);return}
  if(el.id==="imprm"){S.impRemove=el.checked;return}
  if(el.dataset.rename){const v=el.value.replace(/\s+/g," ").trim();if(!v)return;try{await S.db.doc("tasks/"+el.dataset.rename).update({name:v});toast("Renamed.")}catch(e){writeFail(e)}}
  if(el.dataset.tday){const t=S.tasks.find(x=>x.id===el.dataset.tday);if(!t)return;
    const days=[...document.querySelectorAll(`[data-tday="${t.id}"]`)].filter(b=>b.checked).map(b=>+b.value);
    if(!days.length){el.checked=true;toast("Keep at least one day.");return}
    const all=openDays().every(d=>days.includes(d));
    try{await S.db.doc("tasks/"+t.id).update({days:all?null:days});toast(all?`${t.name}: every clinic day.`:`${t.name}: ${daysText(days,", ")} only.`)}catch(e){el.checked=!el.checked;writeFail(e)}return}
  if(el.dataset.day!==undefined){const days=[...document.querySelectorAll("[data-day]")].filter(i=>i.checked).map(i=>+i.dataset.day);if(!days.length){el.checked=true;toast("Keep at least one clinic day.");return}try{await S.db.doc("settings/clinic").set({days});toast("Clinic days saved.")}catch(e){writeFail(e)}return}
  if(el.dataset.rule){const f=el.dataset.rule;const every=Math.round(+$("#rl-e-"+f).value),unit=$("#rl-u-"+f).value,soon=Math.round(+$("#rl-s-"+f).value);
    if(!(every>=1&&every<=365)||!(soon>=0&&soon<=365)){toast("Use whole numbers: due every 1 to 365, due soon 0 to 365.");return}
    const days=unit==="months"?every*30:every; if(soon>=days){toast("The due soon window has to be shorter than the time between due dates.");return}
    try{await S.db.doc("settings/rules").set({...S.rulesRaw,[f]:{every,unit,soon}});toast(`${f} rule saved.`)}catch(e){writeFail(e)}return}
  if(el.dataset.track){try{await S.db.doc("tasks/"+el.dataset.track).update({trackFreq:el.value});toast(`Will start as ${el.value} when turned on.`)}catch(e){writeFail(e)}return}
  if(el.dataset.enable){const t=S.tasks.find(x=>x.id===el.dataset.enable);if(!t)return;try{if(el.checked){const f=t.freq==="Optional"?(t.trackFreq||"Monthly"):t.freq;await S.db.doc("tasks/"+t.id).update({off:false,freq:f,list:f.toLowerCase()});toast(`${t.name} is on.`)}else{await S.db.doc("tasks/"+t.id).update({off:true});toast(`${t.name} is off.`)}}catch(e){writeFail(e)}return}
  if(el.dataset.move){try{await S.db.doc("tasks/"+el.dataset.move).update({list:el.value});toast("Moved.")}catch(e){writeFail(e)}}
  if(el.dataset.freq){const t=S.tasks.find(x=>x.id===el.dataset.freq);if(!t)return;
    try{if(el.value==="Optional"){await S.db.doc("tasks/"+t.id).update({freq:"Optional",trackFreq:t.freq,list:"optional"});toast("Moved to Optional.")}
    else{const nl=el.value.toLowerCase();await S.db.doc("tasks/"+t.id).update({freq:el.value,list:nl,...(t.list==="optional"?{fromOptional:true}:{})});toast(nl!==t.list?`Moved to ${el.value}.`:"Frequency saved.")}}catch(e){writeFail(e)}}
});
document.addEventListener("keydown",ev=>{if(ev.key==="Enter"&&ev.target.matches&&ev.target.matches("textarea.nm")){ev.preventDefault();ev.target.blur()}});
/* ---------- drag to reorder tasks in Setup ---------- */
const GRIP='<svg viewBox="0 0 14 18" aria-hidden="true"><circle cx="4" cy="3" r="1.6"/><circle cx="10" cy="3" r="1.6"/><circle cx="4" cy="9" r="1.6"/><circle cx="10" cy="9" r="1.6"/><circle cx="4" cy="15" r="1.6"/><circle cx="10" cy="15" r="1.6"/></svg>';
function grpRows(row){return [...row.parentElement.querySelectorAll(`.setup-row[data-grp="${row.dataset.grp}"]`)]}
function placeRow(row,y){const rows=grpRows(row).filter(r=>r!==row);if(!rows.length)return;
  const tgt=rows.find(r=>{const b=r.getBoundingClientRect();return y<b.top+b.height/2});
  if(tgt){if(row.nextElementSibling!==tgt)tgt.before(row)}else{const last=rows[rows.length-1];if(last.nextElementSibling!==row)last.after(row)}}
async function saveOrder(row){
  const k=row.dataset.list,ids=[...row.parentElement.querySelectorAll(".setup-row[data-row]")].map(r=>r.dataset.row);
  const ts=ids.map(id=>S.tasks.find(t=>t.id===id)).filter(Boolean);
  let vals=ts.map(t=>t.order??0).sort((a,b)=>a-b);if(new Set(vals).size!==vals.length)vals=ts.map((t,i)=>i+1);
  const prev=new Map(ts.map(t=>[t.id,t.order])),ch=[];
  ts.forEach((t,i)=>{if(t.order!==vals[i]){t.order=vals[i];ch.push(t)}});
  render();if(!ch.length)return;
  try{if(window.TDC&&TDC.batch)await TDC.batch(ch.map(t=>({op:"update",col:"tasks",id:t.id,data:{order:t.order}})));
    else for(const t of ch)await S.db.doc("tasks/"+t.id).update({order:t.order});
    toast("New order saved.")}
  catch(e){ts.forEach(t=>{t.order=prev.get(t.id)});render();writeFail(e)}}
function endDrag(ev){const d=S.drag;if(!d||(ev&&ev.pointerId!==d.pid))return;
  clearInterval(d.scroll);d.row.classList.remove("dragging");document.body.classList.remove("is-dragging");S.drag=null;S.dragPend=false;
  const now=grpRows(d.row).map(r=>r.dataset.row).join();if(now!==d.before)saveOrder(d.row);else render()}
document.addEventListener("pointerdown",ev=>{const g=ev.target.closest&&ev.target.closest(".grip");if(!g||ev.button>0||S.drag)return;
  const row=g.closest(".setup-row");if(!row)return;ev.preventDefault();
  if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
  const d=S.drag={row,pid:ev.pointerId,y:ev.clientY,before:grpRows(row).map(r=>r.dataset.row).join()};
  row.classList.add("dragging");document.body.classList.add("is-dragging");try{g.setPointerCapture(ev.pointerId)}catch(e){}
  d.scroll=setInterval(()=>{const e=72,v=d.y<e?-(e-d.y)/3:d.y>innerHeight-e?(d.y-(innerHeight-e))/3:0;if(v){scrollBy(0,v);placeRow(row,d.y)}},16)});
document.addEventListener("pointermove",ev=>{const d=S.drag;if(!d||ev.pointerId!==d.pid)return;ev.preventDefault();d.y=ev.clientY;placeRow(d.row,ev.clientY)},{passive:false});
document.addEventListener("pointerup",endDrag);document.addEventListener("pointercancel",endDrag);
document.addEventListener("keydown",ev=>{const g=ev.target.closest&&ev.target.closest(".grip");if(!g||S.drag||(ev.key!=="ArrowUp"&&ev.key!=="ArrowDown"))return;ev.preventDefault();
  const row=g.closest(".setup-row"),rows=grpRows(row),i=rows.indexOf(row),j=ev.key==="ArrowUp"?i-1:i+1;if(j<0||j>=rows.length)return;
  if(j<i)rows[j].before(row);else rows[j].after(row);g.focus();saveOrder(row)});
document.addEventListener("keydown",ev=>{if(ev.key==="Escape"&&(S.confirm==="clearall"||S.confirm==="resetall")&&!S.clearing){S.confirm=null;render()}});
document.addEventListener("input",ev=>{if(ev.target.matches&&ev.target.matches("textarea.nm"))fitTa(ev.target);if(ev.target.id==="hq"){S.hist=ev.target.value;render()}});

/* ---------- boot ---------- */
S.tab="today";
renderSnd();render();
(async()=>{
  idle();
  await TDC.signIn();
  const db=TDC.db;S.db=db;S.dl=TDC.downloads;S.canKnown=true;
  db.collection("tasks").onSnapshot(s=>{S.tasks=s.docs.map(d=>({id:d.id,...d.data()}));S.loaded.t=true;syncErr=false;idle();render()},()=>{S.loaded.t=true;syncErr=true;idle();render()});
  db.collection("log").orderBy("at","desc").limit(1000).onSnapshot(s=>{S.log=s.docs.map(d=>({id:d.id,...d.data()}));S.loaded.l=true;render()},()=>{S.loaded.l=true;render()});
  db.doc("settings/team").onSnapshot(s=>{S.team=(s.exists&&s.data().initials)||[];S.loaded.s=true;renderWho();render()},()=>{S.loaded.s=true;render()});
  db.doc("settings/resets").onSnapshot(s=>{S.resets=(s.exists&&s.data())||{};render()},()=>{});
  db.doc("settings/clinic").onSnapshot(s=>{S.clinic=(s.exists&&s.data().days)||null;render()},()=>{});
  db.doc("settings/rules").onSnapshot(s=>{const o=(s.exists&&s.data())||{};S.rulesRaw=o;const R={};for(const f in DEF_RULE){const v=o[f];R[f]=v&&v.every?(v.unit==="months"?{m:v.every,soon:v.soon||0}:{d:v.every,soon:v.soon||0}):DEF_RULE[f]}RULE=R;render()},()=>{});
})();
/* refresh statuses when the day rolls over */
let lastDay=todayISO();setInterval(()=>{if(todayISO()!==lastDay){lastDay=todayISO();document.querySelectorAll("#view input[type=date]").forEach(i=>{i.value=lastDay;i.max=lastDay});render()}},60000);
})();
</script>
